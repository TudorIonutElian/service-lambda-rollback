name: Rollback to commit

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Deployed commit to roll back to (last 5 Lambda versions, newest first)'
        type: choice
        required: true
        # The options between the markers are regenerated by the Deploy workflow after every deploy
        # to main, from the DynamoDB version archive. Don't edit them by hand.
        options:
          # BEGIN generated commit options
          - "v8 · 8"
          - "v7 · 7639438 Log the request id in service-lambda"
          - "v6 · ca993ef Add CDK Lambda with manual alias-based rollback workflow"
          - "v4 · 4-boom"
          - "v3 · 3"
          # END generated commit options
      dry_run:
        description: 'Dry run: only list versions and show what would happen, do not roll back'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # Read workflow runs, to stop if a deploy is running or queued.
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # Options look like "v7 · abc1234 Fix greeting": the Lambda version, then the commit that
      # version was built from (its description).
      - name: Resolve commit to Lambda version
        id: resolve
        env:
          COMMIT_OPTION: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT_OPTION" =~ ^v([0-9]+)\  ]]; then
            echo "::error::'$COMMIT_OPTION' is not a deployed commit. The list is filled after the next deploy to main."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "Rolling back to \`$COMMIT_OPTION\` = Lambda version **$VERSION**." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  rollback:
    needs: resolve
    uses: ./.github/workflows/rollback-by-version.yml
    with:
      target_version: ${{ needs.resolve.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
