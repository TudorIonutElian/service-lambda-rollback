name: Deploy

on:
  push:
    branches: [main]
    # Documentation-only pushes don't deploy.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # Regenerated by the update-commit-dropdown job below.
      - '.github/workflows/rollback-to-commit.yml'
  workflow_dispatch:

permissions:
  contents: read

# Shared with rollback so a deploy and a rollback never race on the alias.
concurrency:
  group: service-lambda-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the Lambda version description is the last commit that touched lambda/.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: npx cdk deploy --require-approval never
      # Archive the newly published version (S3 + DynamoDB) right away instead of waiting
      # for the next scheduled check.
      - name: Sync rollback metadata
        run: |
          set -euo pipefail
          FUNCTION_ERROR=$(aws lambda invoke --function-name service-lambda-rollback \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 150 \
            --payload '{"type":"sync"}' --query 'FunctionError' --output text "$RUNNER_TEMP/sync.json")
          cat "$RUNNER_TEMP/sync.json"; echo
          if [[ "$FUNCTION_ERROR" != "None" ]] || jq -e 'any(.[]; .synced == false)' "$RUNNER_TEMP/sync.json" >/dev/null; then
            echo "::error::Sync failed: $(cat "$RUNNER_TEMP/sync.json")"
            exit 1
          fi

  # Refreshes the "Rollback to commit" dropdown with the last 5 archived Lambda versions. GitHub
  # can't fill a dropdown at run time, so the options are written into the workflow file and pushed.
  # Needs a WORKFLOW_PAT secret (a token with `workflow` scope): the built-in GITHUB_TOKEN may not
  # change workflow files. The commit is marked [skip ci] and the file is in paths-ignore above, so
  # it doesn't start another deploy.
  update-commit-dropdown:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      FUNCTION_NAME: service-lambda
      TABLE_NAME: service-lambda-rollback-versions
      WORKFLOW_FILE: .github/workflows/rollback-to-commit.yml
    steps:
      - name: Check for WORKFLOW_PAT
        id: pat
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [[ -z "$WORKFLOW_PAT" ]]; then
            echo "::warning::WORKFLOW_PAT secret is not set, so the Rollback to commit dropdown was not updated."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.pat.outputs.available == 'true'
        with:
          ref: main
          token: ${{ secrets.WORKFLOW_PAT }}
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.pat.outputs.available == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Regenerate commit options
        if: steps.pat.outputs.available == 'true'
        run: |
          set -euo pipefail
          aws dynamodb query --table-name "$TABLE_NAME" --consistent-read \
            --key-condition-expression 'functionName = :f AND begins_with(sk, :prefix)' \
            --expression-attribute-values "{\":f\":{\"S\":\"$FUNCTION_NAME\"},\":prefix\":{\"S\":\"VERSION#\"}}" \
            --output json > "$RUNNER_TEMP/versions.json"

          node <<'EOF'
          const fs = require('fs');
          const { Items = [] } = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/versions.json`, 'utf8'));
          // Newest 5 versions; each label is "v<version> · <commit hash + message>".
          const options = Items
            .map((item) => ({ version: Number(item.version.N), description: item.description?.S || '(no description)' }))
            .sort((a, b) => b.version - a.version)
            .slice(0, 5)
            .map(({ version, description }) => `v${version} · ${description}`.slice(0, 100));
          if (options.length === 0) {
            console.log('No archived versions yet; leaving the dropdown unchanged.');
            process.exit(0);
          }
          const file = process.env.WORKFLOW_FILE;
          const yaml = fs.readFileSync(file, 'utf8');
          const pattern = /(\n( *)# BEGIN generated commit options\n)[\s\S]*?(\n *# END generated commit options)/;
          const match = yaml.match(pattern);
          if (!match) throw new Error(`Generated options markers not found in ${file}`);
          const indent = match[2];
          // JSON strings are valid YAML double-quoted strings, so any commit message is safe.
          const lines = options.map((option) => `${indent}- ${JSON.stringify(option)}`).join('\n');
          fs.writeFileSync(file, yaml.replace(pattern, (_, begin, __, end) => `${begin}${lines}${end}`));
          console.log(`Options:\n${options.join('\n')}`);
          EOF

          if git diff --quiet -- "$WORKFLOW_FILE"; then
            echo "Dropdown already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Rollback to commit options [skip ci]" -- "$WORKFLOW_FILE"
          # main may have moved since this run started.
          git push || { git pull --rebase && git push; }
