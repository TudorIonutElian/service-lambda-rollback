name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Lambda version to roll back to (leave empty for the previous version)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: only list versions and show what would happen, do not roll back'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: service-lambda-release
  cancel-in-progress: false

env:
  FUNCTION_NAME: service-lambda
  ALIAS_NAME: live

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Point the alias back at an already-published version. No build, no upload.
      - name: ${{ inputs.dry_run && 'Dry run - list versions' || 'Point alias at previous version' }}
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" \
            --query 'FunctionVersion' --output text)
          echo "Alias '$ALIAS_NAME' currently points to version $CURRENT_VERSION"

          # Version, LastModified, CodeSha256 - one line per published version, oldest first.
          VERSION_ROWS=$(aws lambda list-versions-by-function --function-name "$FUNCTION_NAME" \
            --query 'Versions[?Version!=`$LATEST`].[Version,LastModified,CodeSha256]' --output text | sort -n)
          VERSIONS=$(cut -f1 <<<"$VERSION_ROWS")

          if [[ "$DRY_RUN" == "true" ]]; then
            {
              echo "## Versions of \`$FUNCTION_NAME\`"
              echo
              echo "| Version | Last modified | Code SHA256 | |"
              echo "|---|---|---|---|"
              while IFS=$'\t' read -r version modified sha; do
                marker=""
                [[ "$version" == "$CURRENT_VERSION" ]] && marker="⬅ \`$ALIAS_NAME\`"
                echo "| $version | $modified | \`${sha:0:12}…\` | $marker |"
              done <<<"$VERSION_ROWS"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -z "$TARGET_VERSION" ]]; then
            # Highest published version lower than the current one.
            TARGET_VERSION=$(echo "$VERSIONS" | awk -v cur="$CURRENT_VERSION" '$1 < cur' | tail -n 1)
            if [[ -z "$TARGET_VERSION" ]]; then
              echo "::error::No version older than $CURRENT_VERSION exists - nothing to roll back to."
              exit 1
            fi
          elif ! grep -qx "$TARGET_VERSION" <<<"$VERSIONS"; then
            echo "::error::Version $TARGET_VERSION does not exist. Available: $(echo $VERSIONS)"
            exit 1
          fi

          if [[ "$TARGET_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Alias already on version $TARGET_VERSION - nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "**Dry run:** would roll back \`$FUNCTION_NAME:$ALIAS_NAME\` from version **$CURRENT_VERSION** to **$TARGET_VERSION**. Nothing was changed. Re-run without dry run (optionally with a version from the table) to roll back." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Rolling back '$ALIAS_NAME': $CURRENT_VERSION -> $TARGET_VERSION"
          aws lambda update-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" \
            --function-version "$TARGET_VERSION" --output table

          echo "Rolled back \`$FUNCTION_NAME:$ALIAS_NAME\` from version **$CURRENT_VERSION** to **$TARGET_VERSION**." >> "$GITHUB_STEP_SUMMARY"
