name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Lambda version to roll back to (leave empty for the previous version)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: only list versions and show what would happen, do not roll back'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # Read workflow runs, to stop if a deploy is running or queued.
  actions: read

env:
  FUNCTION_NAME: service-lambda
  ALIAS_NAME: live
  ROLLBACK_FUNCTION_NAME: service-lambda-rollback
  TABLE_NAME: service-lambda-rollback-versions
  # Workflows whose running or queued runs block a rollback.
  DEPLOY_WORKFLOWS: deploy.yml deploy-branch.yml

jobs:
  # Runs outside the release lock, so it can stop straight away instead of waiting for the deploy
  # to finish and then rolling back over it.
  check-deploys:
    runs-on: ubuntu-latest
    steps:
      - name: Stop if a deploy is running or queued
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ACTIVE=$(for workflow in $DEPLOY_WORKFLOWS; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 20 \
              --json status,workflowName,headBranch,url \
              --jq '.[] | select(.status != "completed") | "\(.workflowName) (\(.status)) on \(.headBranch): \(.url)"'
          done)
          if [[ -z "$ACTIVE" ]]; then
            echo "No deploy running or queued."
            exit 0
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::warning::A deploy is running or queued; the dry run's version list may change once it finishes."
            echo "$ACTIVE"
            exit 0
          fi
          echo "::error::A deploy is running or queued, so the rollback was stopped. Re-run it once the deploy has finished."
          echo "$ACTIVE"
          { echo "**Rollback stopped:** a deploy is running or queued."; echo; sed 's/^/- /' <<<"$ACTIVE"; } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  rollback:
    needs: check-deploys
    runs-on: ubuntu-latest
    # Shared with the deploy workflows: a deploy started after this job has the lock waits for it.
    concurrency:
      group: service-lambda-release
      cancel-in-progress: false
    steps:
      # Same check again, now holding the lock: catches a deploy queued since check-deploys ran.
      - name: Stop if a deploy is running or queued
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE=$(for workflow in $DEPLOY_WORKFLOWS; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 20 \
              --json status,workflowName,headBranch,url \
              --jq '.[] | select(.status != "completed") | "\(.workflowName) (\(.status)) on \(.headBranch): \(.url)"'
          done)
          if [[ -n "$ACTIVE" ]]; then
            echo "::error::A deploy is running or queued, so the rollback was stopped. Re-run it once the deploy has finished."
            echo "$ACTIVE"
            { echo "**Rollback stopped:** a deploy is running or queued."; echo; sed 's/^/- /' <<<"$ACTIVE"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No deploy running or queued."

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Make sure every published version is archived (S3 + DynamoDB) before choosing a target.
      - name: Sync rollback metadata
        run: |
          set -euo pipefail
          FUNCTION_ERROR=$(aws lambda invoke --function-name "$ROLLBACK_FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 150 \
            --payload "{\"type\":\"sync\",\"functionName\":\"$FUNCTION_NAME\"}" \
            --query 'FunctionError' --output text "$RUNNER_TEMP/sync.json")
          cat "$RUNNER_TEMP/sync.json"; echo
          if [[ "$FUNCTION_ERROR" != "None" ]] || jq -e 'any(.[]; .synced != true)' "$RUNNER_TEMP/sync.json" >/dev/null; then
            echo "::error::Sync failed: $(cat "$RUNNER_TEMP/sync.json")"
            exit 1
          fi

      # Point the alias back at an archived version, then restore $LATEST from that version's
      # zip in S3. No build: the package is the one archived when the version was published.
      - name: ${{ inputs.dry_run && 'Dry run - list versions' || 'Point alias at previous version' }}
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" \
            --query 'FunctionVersion' --output text)
          echo "Alias '$ALIAS_NAME' currently points to version $CURRENT_VERSION"

          # One tab-separated line per archived version, oldest first:
          # version, lastModified, codeSha256, s3Bucket, s3Key, rolledBackBy, description
          # Empty fields become "-": bash `read` merges consecutive tabs, which would shift columns.
          VERSION_ROWS=$(aws dynamodb query --table-name "$TABLE_NAME" --consistent-read \
            --key-condition-expression 'functionName = :f AND begins_with(sk, :prefix)' \
            --expression-attribute-values "{\":f\":{\"S\":\"$FUNCTION_NAME\"},\":prefix\":{\"S\":\"VERSION#\"}}" \
            --output json \
            | jq -r 'def orDash: if . == null or . == "" then "-" else . end;
                     .Items[] | [.version.N, .lastModified.S, .codeSha256.S, .s3Bucket.S, .s3Key.S,
                                 (.rolledBackBy.S | orDash), (.description.S | orDash)] | @tsv' \
            | sort -n)
          VERSIONS=$(cut -f1 <<<"$VERSION_ROWS")

          if [[ "$DRY_RUN" == "true" ]]; then
            {
              echo "## Archived versions of \`$FUNCTION_NAME\`"
              echo
              echo "| Version | Description | Last modified | Code SHA256 | S3 key | Rolled back by | |"
              echo "|---|---|---|---|---|---|---|"
              while IFS=$'\t' read -r version modified sha bucket key rolled_back_by description; do
                marker=""
                [[ "$version" == "$CURRENT_VERSION" ]] && marker="⬅ \`$ALIAS_NAME\`"
                echo "| $version | ${description//|/\\|} | $modified | \`${sha:0:12}…\` | \`$key\` | $rolled_back_by | $marker |"
              done <<<"$VERSION_ROWS"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -z "$TARGET_VERSION" ]]; then
            # Highest archived version lower than the current one.
            TARGET_VERSION=$(echo "$VERSIONS" | awk -v cur="$CURRENT_VERSION" '$1 < cur' | tail -n 1)
            if [[ -z "$TARGET_VERSION" ]]; then
              echo "::error::No archived version older than $CURRENT_VERSION exists - nothing to roll back to."
              exit 1
            fi
          elif ! grep -qx "$TARGET_VERSION" <<<"$VERSIONS"; then
            echo "::error::Version $TARGET_VERSION is not archived. Available: $(echo $VERSIONS)"
            exit 1
          fi

          if [[ "$TARGET_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Alias already on version $TARGET_VERSION - nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          IFS=$'\t' read -r _ _ TARGET_SHA TARGET_BUCKET TARGET_KEY _ < <(awk -F'\t' -v v="$TARGET_VERSION" '$1 == v' <<<"$VERSION_ROWS")

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "**Dry run:** would roll back \`$FUNCTION_NAME:$ALIAS_NAME\` from version **$CURRENT_VERSION** to **$TARGET_VERSION** and restore \`\$LATEST\` from \`s3://$TARGET_BUCKET/$TARGET_KEY\`. Nothing was changed. Re-run without dry run (optionally with a version from the table) to roll back." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Rolling back '$ALIAS_NAME': $CURRENT_VERSION -> $TARGET_VERSION"
          aws lambda update-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" \
            --function-version "$TARGET_VERSION" --output table

          # Lambda pulls the archived zip from S3 itself. Only code is restored; $LATEST keeps its
          # current configuration. No new version is published.
          echo "Restoring \$LATEST from s3://$TARGET_BUCKET/$TARGET_KEY ($TARGET_SHA)"
          LATEST_SHA=$(aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --s3-bucket "$TARGET_BUCKET" --s3-key "$TARGET_KEY" --no-publish \
            --query 'CodeSha256' --output text)
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          if [[ "$LATEST_SHA" != "$TARGET_SHA" ]]; then
            echo "::error::\$LATEST code hash $LATEST_SHA does not match version $TARGET_VERSION ($TARGET_SHA)"
            exit 1
          fi

          # Record it: CURRENT starts the automatic rollback cooldown (manual rollbacks don't count
          # towards the consecutive-rollback limit), and the version rolled back from is marked.
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          aws dynamodb put-item --table-name "$TABLE_NAME" --item "$(jq -n \
            --arg fn "$FUNCTION_NAME" --arg to "$TARGET_VERSION" --arg from "$CURRENT_VERSION" --arg now "$NOW" \
            '{functionName: {S: $fn}, sk: {S: "CURRENT"}, version: {N: $to}, previousVersion: {N: $from},
              updatedBy: {S: "manual-rollback"}, updatedAt: {S: $now}, lastRollbackAt: {S: $now},
              rollbackCount: {N: "0"}}')"

          VERSION_KEY=$(jq -n --arg fn "$FUNCTION_NAME" --arg sk "$(printf 'VERSION#%010d' "$CURRENT_VERSION")" \
            '{functionName: {S: $fn}, sk: {S: $sk}}')

          # How long the version rolled back from had been stable: from its stableAt until now. Only
          # counts if it is still marked stable, i.e. it was marked stable during this time live.
          IFS=$'\t' read -r STABLE_FOR_SECONDS STABLE_FOR < <(aws dynamodb get-item --table-name "$TABLE_NAME" \
            --key "$VERSION_KEY" --consistent-read --output json \
            | jq -r --arg now "$NOW" '
                def ts: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
                def duration: . as $s
                  | [ ($s / 86400 | floor | select(. > 0) | "\(.)d"),
                      ($s % 86400 / 3600 | floor | select(. > 0) | "\(.)h"),
                      ($s % 3600 / 60 | floor | select(. > 0) | "\(.)m") ]
                  | if length > 0 then join(" ") else "\($s)s" end;
                (.Item // {}) as $item
                | (if $item.stable.BOOL == true and $item.stableAt.S != null
                   then ([0, (($now | ts) - ($item.stableAt.S | ts))] | max) else 0 end) as $seconds
                | [$seconds, (if $seconds > 0 then ($seconds | duration) else "not marked stable while live" end)]
                | @tsv')

          aws dynamodb update-item --table-name "$TABLE_NAME" --key "$VERSION_KEY" \
            --update-expression 'SET rolledBackAt = :at, rolledBackBy = :by, rollbackReason = :reason, stable = :false, stableForSeconds = :stableForSeconds, stableFor = :stableFor' \
            --condition-expression 'attribute_exists(sk)' \
            --expression-attribute-values "$(jq -n --arg now "$NOW" --arg actor "$GITHUB_ACTOR" \
              --arg seconds "$STABLE_FOR_SECONDS" --arg stableFor "$STABLE_FOR" \
              '{":at": {S: $now}, ":by": {S: "manual-rollback"}, ":reason": {S: ("GitHub Actions by " + $actor)}, ":false": {BOOL: false},
                ":stableForSeconds": {N: $seconds}, ":stableFor": {S: $stableFor}}')" \
            && echo "Version $CURRENT_VERSION was stable for: $STABLE_FOR" \
            || echo "::warning::Version $CURRENT_VERSION is not archived; it was not marked as rolled back."

          echo "Rolled back \`$FUNCTION_NAME:$ALIAS_NAME\` from version **$CURRENT_VERSION** to **$TARGET_VERSION**, and restored \`\$LATEST\` from \`s3://$TARGET_BUCKET/$TARGET_KEY\` (\`$TARGET_SHA\`)." \
            | tee -a "$GITHUB_STEP_SUMMARY"
