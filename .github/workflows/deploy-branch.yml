name: Deploy branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

permissions:
  contents: read

# Shared with deploy and rollback so they never race on the alias.
concurrency:
  group: service-lambda-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the Lambda version description is the last commit that touched lambda/.
          fetch-depth: 0
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy ${{ inputs.branch }}
        run: |
          echo "Deploying branch \`$BRANCH\` ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          npx cdk deploy --require-approval never
        env:
          BRANCH: ${{ inputs.branch }}
